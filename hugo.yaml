baseURL: https://blog.dzhou.net/
title: dzhou
theme: PaperMod

# 语言设置（中文站：hasCJKLanguage 让字数统计、阅读时间按中文计算）
languageCode: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true

# 永久性链接
permalinks:
  posts: "/:slug/"

# 启用 emoji 支持
enableEmoji: true

# 启用 robots.txt
enableRobotsTXT: true

# 每页显示的文章数
pagination:
  pagerSize: 10

languages:
  zh:
    label: "中文"
    weight: 1

# PaperMod 主题配置
params:
  # 基础信息
  author: "dzhou"
  description: "dzhou 的个人技术笔记：Git、Windows、输入法等常用操作记录"
  ShowToc: true
  TocOpen: true

  # 显示设置
  ShowReadingTime: true # 显示阅读时间
  ShowShareButtons: false # 显示分享按钮
  ShowPostNavLinks: true # 显示上一篇/下一篇
  ShowBreadCrumbs: false # 显示面包屑导航
  ShowCodeCopyButtons: true # 显示代码复制按钮
  ShowWordCount: true # 显示字数统计
  ShowRssButtonInSectionTermList: true

  # 站点图标（文件位于 static/）
  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"

  # 首页模式
  homeInfoParams: # Home-Info 模式
    Title: "一万年太久，只争朝夕"
    Content: "世上本无事，庸人自扰之。"

# 菜单配置
menu:
  main:
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40

# 输出格式（JSON 用于搜索功能，RSS 用于订阅）
outputs:
  home:
    - HTML
    - RSS
    - JSON

#主题
markup:
  highlight:
    style: "onedark"
    lineNos: false
    codeFences: true
    guessSyntax: true
    noClasses: false
