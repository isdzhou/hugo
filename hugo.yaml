baseURL: https://blog.dzhou.net/  # 改成你的域名
languageCode: zh-cn
title: dzhou
theme: PaperMod

# 启用 emoji 支持
enableEmoji: true

# 启用 robots.txt
enableRobotsTXT: true

# 每页显示的文章数
pagination:
  pagerSize: 10

# 语言设置
languages:
  zh:
    languageName: "中文"
    weight: 1

# PaperMod 主题配置
params:
  # 基础信息
  author: "dzhou"
  description: "你的网站描述"
  
  # 显示设置
  ShowReadingTime: true      # 显示阅读时间
  ShowShareButtons: false     # 显示分享按钮
  ShowPostNavLinks: true     # 显示上一篇/下一篇
  ShowBreadCrumbs: false      # 显示面包屑导航
  ShowCodeCopyButtons: true  # 显示代码复制按钮
  ShowWordCount: true        # 显示字数统计
  ShowRssButtonInSectionTermList: true
  
  # 首页模式
  homeInfoParams:          # Home-Info 模式
    Title: "一万年太久，只争朝夕"
    Content: "世上本无事，庸人自扰之。"

# 菜单配置
menu:
  main:
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30

# 输出格式（用于搜索功能）
outputs:
  home:
    - HTML
    - JSON
