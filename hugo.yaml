baseURL: https://yourname.github.io/  # 改成你的域名
languageCode: zh-cn
title: dzhou
theme: PaperMod

# 启用 emoji 支持
enableEmoji: true

# 启用 robots.txt
enableRobotsTXT: true

# 每页显示的文章数
pagination:
  pagerSize: 10

# 语言设置
languages:
  zh:
    languageName: "中文"
    weight: 1

# PaperMod 主题配置
params:
  # 基础信息
  author: "dzhou"
  description: "你的网站描述"
  
  # 显示设置
  ShowReadingTime: true      # 显示阅读时间
  ShowShareButtons: true     # 显示分享按钮
  ShowPostNavLinks: true     # 显示上一篇/下一篇
  ShowBreadCrumbs: true      # 显示面包屑导航
  ShowCodeCopyButtons: true  # 显示代码复制按钮
  ShowWordCount: true        # 显示字数统计
  ShowRssButtonInSectionTermList: true
  
  # 首页模式（三选一）
  # homeInfoParams:          # Home-Info 模式
  #   Title: "欢迎来到我的博客"
  #   Content: "这里是描述文字"
  
  # profileMode:                # Profile 模式（我选的这个）
  #   enabled: true
  #   title: "My Wilderness"    # 主标题
  #   subtitle: "记录、思考、探索"
  #   imageUrl: "/images/avatar.jpg"  # 头像路径
  #   imageWidth: 120
  #   imageHeight: 120
  #   buttons:
  #     - name: 旷野
  #       url: /posts/
  #     - name: 关于
  #       url: /about/
  
  # 社交图标
  # socialIcons:
  #   - name: github
  #     url: "https://github.com/yourname"
  #     title: "访问我的 GitHub"
  #   - name: email
  #     url: "mailto:your@email.com"
  #     title: "发送邮件给我"

# 菜单配置
menu:
  main:
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30

# 输出格式（用于搜索功能）
outputs:
  home:
    - HTML
    - JSON
